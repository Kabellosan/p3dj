<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>P3 DJ</title>
<style>
  :root { --bg:#111; --fg:#f2f2f2; --muted:#999; --accent:#1db954; --card:#1c1c1c; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui, sans-serif; }
  main { max-width:640px; margin:0 auto; padding:24px 16px; }
  h1 { margin:0 0 4px; font-size:28px; }
  .muted { color:var(--muted); font-size:14px; }
  .card { background:var(--card); border-radius:12px; padding:16px; margin:16px 0; }
  label { display:block; font-size:14px; color:var(--muted); margin-bottom:4px; }
  input, select { width:100%; box-sizing:border-box; padding:10px; border-radius:8px; border:1px solid #333; background:#000; color:var(--fg); font-size:15px; }
  button { padding:10px 16px; border-radius:999px; border:0; background:var(--accent); color:#000; font-weight:600; font-size:15px; cursor:pointer; }
  button.secondary { background:#333; color:var(--fg); }
  .row { display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
  #now { font-size:20px; font-weight:600; }
  #bar { position:relative; height:10px; background:#333; border-radius:5px; margin-top:12px; overflow:hidden; cursor:pointer; }
  #bar .gap { position:absolute; top:0; bottom:0; background:var(--accent); opacity:.45; }
  #bar .pos { position:absolute; top:0; bottom:0; width:2px; background:#fff; }
  .hidden { display:none; }
</style>
</head>
<body>
<main>
  <h1>P3 DJ</h1>
  <div class="muted">The hosts from DR, the music from you.</div>

  <div class="card" id="login">
    <label for="clientId">Spotify app Client ID (from developer.spotify.com, see README)</label>
    <input id="clientId" placeholder="e.g. 3f2a…">
    <div class="row"><button id="loginBtn">Connect Spotify</button></div>
  </div>

  <div class="card hidden" id="setup">
    <label for="episode">Episode</label>
    <select id="episode"></select>
    <div style="height:12px"></div>
    <label for="playlist">Music for the gaps: a Spotify playlist link, or leave empty for your Liked Songs</label>
    <input id="playlist" placeholder="https://open.spotify.com/playlist/…">
    <div class="row">
      <button id="startBtn">Start the show</button>
      <span class="muted" id="deviceStatus">Connecting the player…</span>
    </div>
  </div>

  <div class="card hidden" id="player">
    <div class="muted" id="mode">On air</div>
    <div id="now">—</div>
    <div class="muted" id="time"></div>
    <div id="bar"><div class="pos" id="pos"></div></div>
    <div class="row">
      <button id="playPause" class="secondary">Pause</button>
      <button id="skip" class="secondary">Skip song</button>
      <button id="back" class="secondary">Back 15 s</button>
    </div>
  </div>

  <audio id="show" preload="auto"></audio>
</main>
<script src="player.js"></script>
<script src="https://sdk.scdn.co/spotify-player.js"></script>
</body>
</html>
